<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Jicjic's Coffee Jelly</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">

                <div class="logo-icon">☕</div>

                <div class="logo-text">
                    <div class="logo-name">Jicjic's</div>
                    <div class="logo-subtitle">Coffee Jelly</div>
                </div>

            </a>

            <div class="nav-links">

                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact</a>

            </div>

            <div class="nav-actions">

                <a href="cart.html" class="cart-link active">
                    🛒 Cart (<span id="cartCount">0</span>)
                </a>

                <a href="login.html" class="login-btn">
                    Login
                </a>

            </div>

        </div>

    </nav>

    <section class="cart-section">

        <div class="container">

            <h1>Shopping Cart</h1>

            <p>
                <span id="totalItems">0</span>
                items in your cart
            </p>

            <div id="cartItems"></div>

            <div id="cartSummary"></div>

        </div>

    </section>

<script>

async function loadCart() {

    const response = await fetch("http://localhost:5000/cart");

    const cart = await response.json();

    const cartItems = document.getElementById("cartItems");

    const totalItems = document.getElementById("totalItems");

    let subtotal = 0;

    cartItems.innerHTML = "";

    totalItems.innerText = cart.length;

    cart.forEach(item => {

        subtotal += item.price * item.quantity;

        cartItems.innerHTML += `

        <div class="cart-item" style="
            background:white;
            padding:20px;
            margin-bottom:15px;
            border-radius:10px;
        ">

            <h2>${item.productName}</h2>

            <p><b>Name:</b> ${item.customerName}</p>

            <p><b>Location:</b> ${item.location}</p>

            <p><b>Price:</b> ₱${item.price}</p>

            <p><b>Quantity:</b> ${item.quantity}</p>

        </div>

        `;

    });

    document.getElementById("cartSummary").innerHTML = `

        <div style="
            background:white;
            padding:20px;
            border-radius:10px;
        ">

            <h2>Order Summary</h2>

            <p>Subtotal: ₱${subtotal}</p>

            <p>Delivery Fee: ₱10</p>

            <h3>Total: ₱${subtotal + 10}</h3>

            <button onclick="checkout()" style="
                width:100%;
                padding:12px;
                background:black;
                color:white;
                border:none;
                border-radius:8px;
                cursor:pointer;
            ">
                Proceed to Checkout
            </button>

        </div>

    `;

}

function checkout() {

    alert("Order placed successfully!");

}

loadCart();

</script>

</body>
</html>
