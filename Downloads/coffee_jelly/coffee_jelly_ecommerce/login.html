<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Jicjic's Coffee Jelly</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">☕</div>
                <div class="logo-text">
                    <div class="logo-name">Jicjic's</div>
                    <div class="logo-subtitle">Coffee Jelly</div>
                </div>
            </a>

            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact</a>
            </div>

            <div class="nav-actions">
                <a href="cart.html" class="cart-link">
                    🛒 Cart (<span id="cartCount">0</span>)
                </a>
                <a href="login.html" class="login-btn" id="authBtn">Login</a>
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
            </div>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-icon">🔐</div>
            <h1>Welcome Back</h1>
            <p>Login to your account</p>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>

            <p class="auth-link">
                Don't have an account? <a href="register.html">Register here</a>
            </p>

            <div class="demo-info">
                <strong>Demo:</strong> Create an account to test the login system
            </div>
        </div>
    </section>

    <div id="notification" class="notification"></div>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
